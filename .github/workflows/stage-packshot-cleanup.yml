name: Stage background cleanup for existing real packshots
on:
  push:
    branches: [assets/clean-packshot-backgrounds]
    paths:
      - scripts/stage-clean-packshots.py
      - .github/workflows/stage-packshot-cleanup.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install background segmentation library
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0 rembg==2.0.67 onnxruntime==1.22.1
      - name: Prepare mask-only clean background candidates
        run: python scripts/stage-clean-packshots.py
        env:
          U2NET_HOME: /tmp/depotflow-rembg
      - name: Save candidates for manual inspection on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/packshot-cleanup-preview
          git diff --cached --quiet && exit 0
          git commit -m "assets: stage white-background packshot candidates for visual review"
          git push origin HEAD:assets/clean-packshot-backgrounds
