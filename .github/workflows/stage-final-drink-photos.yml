name: Stage last three genuine bottle photo candidates
on:
  push:
    branches: [assets/final-three-drink-photos]
    paths:
      - docs/final-shop-photo-candidates.json
      - scripts/stage-final-drink-photos.py
      - .github/workflows/stage-final-drink-photos.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Download candidates and strip metadata (requires manual visual review)
        run: python scripts/stage-final-drink-photos.py
      - name: Commit staged images and precise fetch report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/final-shop-photo-fetch-results.json public/catalogue-photos/
          git diff --cached --quiet && exit 0
          git commit -m 'assets: stage remaining drink photo candidates for visual review'
          git push origin HEAD:assets/final-three-drink-photos
