name: One-time remaining real bottle photo candidates
on:
  push:
    branches:
      - assets/remaining-real-shop-packshots
    paths:
      - .github/workflows/one-time-remaining-photos.yml
      - scripts/fetch-remaining-photos.py
      - docs/remaining-shop-photo-candidates.json
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - run: python scripts/fetch-remaining-photos.py
      - name: Commit real candidates for explicit visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remaining-shop-photo-fetch-results.json public/catalogue-photos/
          git diff --cached --quiet && exit 0
          git commit -m "assets(photos): download remaining candidate bottle packshots for visual review"
          git push origin HEAD:assets/remaining-real-shop-packshots
