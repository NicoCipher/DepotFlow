name: Prepare Goldberg bottle photo (one time)

on:
  push:
    branches: [assets/real-goldberg-photo]
    paths:
      - .github/workflows/prepare-goldberg-photo.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Download and optimize authentic photo
        run: python .github/scripts/prepare_goldberg_packshot.py
      - name: Commit owned copy of optimized photograph to image branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/catalogue-photos/goldberg-60cl.webp
          git commit -m "assets: add optimized real Goldberg 60cl bottle photograph"
          git push origin HEAD:assets/real-goldberg-photo
# Retry with checked alternate source.
