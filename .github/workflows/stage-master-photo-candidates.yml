name: Stage master catalogue photo candidates
on:
  push:
    branches: [assets/master-catalogue-photo-expansion]
    paths:
      - docs/master-photo-candidates.json
      - scripts/stage-master-catalogue-photos.py
      - .github/workflows/stage-master-photo-candidates.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Fetch authentic product photos for review
        run: python scripts/stage-master-catalogue-photos.py
      - name: Commit preview candidates (no live links)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/master-photo-preview
          git diff --cached --quiet && exit 0
          git commit -m "assets: stage master catalogue product photo candidates for review"
          git push origin HEAD:assets/master-catalogue-photo-expansion
