# Temporary, manually-triggered verification workflow. Runs the SQL test
# suite and real-concurrency checks against a disposable Postgres 17
# instance — never against production Supabase, which this workflow never
# connects to or has credentials for.
name: Verify database (disposable Postgres 17)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "supabase/**"
      - "docs/m2-applied-sql-reconciliation-manifest-20261019.json"
      - "docs/m2-forward-only-release-inventory-20261019.json"
      - "scripts/build-forward-only-bundle.py"
      - "scripts/test_forward_only_bundle.py"
      - "docs/release-evidence/**"
      - "scripts/build-forward-only-m2-release.py"
      - ".github/workflows/verify-database.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Verify unambiguous Supabase migration history
        run: python3 supabase/tests/check_migration_versions.py

      - name: Check tenancy migration deployment ordering and detect live history mismatch
        run: |
          set -euo pipefail
          python3 supabase/tests/check_tenancy_release_order.py
          # The Oct 18 read-only 55-entry production snapshot and historical git SQL
          # currently disagree. Verify the release preflight FAILS CLOSED,
          # rather than treating an empty-database SQL pass as permission to push.
          if python3 supabase/tests/check_tenancy_release_order.py \
              --remote-history supabase/tests/fixtures/production_migration_history_20261018.json > /tmp/tenancy-release-preflight.log 2>&1; then
            echo "Unexpectedly passed mismatched live migration history"
            exit 1
          fi
          grep -Fq "PRODUCTION RELEASE BLOCKED" /tmp/tenancy-release-preflight.log
          grep -Fq "Remote entries missing locally" /tmp/tenancy-release-preflight.log
          echo "Preflight correctly blocked unreconciled production-history upgrade"


      - name: Assert live migration release gate fails safely on historical drift
        run: python3 -m unittest discover -s supabase/tests -p 'test_live_migration_history.py'

      - name: Verify all historical SQL evidence and preserved original checksums
        run: python3 -m unittest discover -s supabase/tests -p 'test_applied_sql_manifest.py'

      - name: Verify sandbox-only replay materialization
        run: python3 -m unittest discover -s supabase/tests -p 'test_materialize_prod_history.py'

      - name: Test forward-only migration rehearsal bundle and 56-version ledger gates
        run: python3 -m unittest discover -s scripts -p 'test_forward_only_bundle.py'

      - name: Verify forward-only release candidate and fail-closed ledger binding
        run: |
          set -euo pipefail
          python3 -m unittest discover -s supabase/tests -p 'test_forward_only_m2_release.py'
          python3 scripts/build-forward-only-m2-release.py \
            --remote-history supabase/tests/fixtures/production_migration_history_20261019_after_auth.json

      - name: Test strict six-category schema drift classifier (offline)
        run: python3 -m unittest discover -s scripts -p 'test_classify_m2_schema_drift.py'

      - name: Install PostgreSQL 17 (official signed PGDG APT)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/depotflow-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17

      - name: Configure disposable cluster (port 55439, /tmp socket, local trust)
        run: |
          set -euo pipefail
          # PGDG package installation may not auto-create 17/main on runners
          # already containing a different PostgreSQL cluster.
          if [[ ! -f /etc/postgresql/17/main/postgresql.conf ]]; then
            sudo pg_createcluster 17 main
          fi
          PGCONF=/etc/postgresql/17/main
          sudo sed -i "s/^port = 5432.*/port = 55439/" "$PGCONF/postgresql.conf"
          sudo sed -i "s#^unix_socket_directories = .*#unix_socket_directories = '/tmp,/var/run/postgresql'#" "$PGCONF/postgresql.conf"
          sudo sed -i "s/^local   all             postgres.*peer/local   all             postgres                                trust/" "$PGCONF/pg_hba.conf"
          sudo sed -i "s/^local   all             all.*peer/local   all             all                                     trust/" "$PGCONF/pg_hba.conf"
          # PostgreSQL 17's cluster can be assigned 5433 and remain DOWN
          # if 16 is preinstalled. Explicit late overrides and startup avoid
          # connecting to the wrong major on a GitHub runner.
          printf "\\nport = 55439\\nunix_socket_directories = '/tmp,/var/run/postgresql'\\n" \
            | sudo tee -a "$PGCONF/postgresql.conf"
          sudo pg_ctlcluster 17 main start
          sleep 2
          sudo pg_lsclusters
          psql -h /tmp -p 55439 -d postgres -X -At -c "select current_setting('server_version_num');" \
            | grep '^17'

      - name: Bootstrap the minimal Supabase-platform surface
        run: psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            if [[ "$f" == *20261030100000_revoke_client_maintenance_privileges.sql ]]; then
              # Recreate captured pre-hardening client grants ONLY in disposable PG17.
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/tenant_client_maintenance_acl_before.sql
            fi
            if [[ "$f" == *retire_legacy_public_rpcs.sql ]]; then
              # These files exercise the historical signatures; run them at
              # their final supported migration state before retirement.
              for old in customer_archiving customer_payments empties_rules sale_partial_pricing record_sale_v2_empties; do
                psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f "supabase/tests/$old.sql"
              done
              for old in customer_archiving customer_payments; do
                python3 "supabase/tests/concurrency/$old.py"
              done
            fi
            if [[ "$f" == *20261016020600_gate_legacy_owner_reads.sql ]]; then
              # P1 regression: an unexpected permissive read policy could OR
              # USING(true) with owner_read and reveal a foreign owner's cost.
              # This should abort atomically even when 26/27 known policies
              # still match. All probes are ONLY in this disposable PG17 DB.
              for mode in read all; do
                if [[ "$mode" == read ]]; then
                  kind="select"
                else
                  kind="all"
                fi
                psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "create policy depotflow_ci_unknown_policy on public.product_cost_history for $kind to authenticated using (true);"
                if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f "$f" \
                    > /tmp/depotflow-policy-roster-rejection.log 2>&1; then
                  echo "::error::Unsafe extra $mode policy incorrectly accepted"
                  exit 1
                fi
                grep -Fq "Unexpected owner-read policy identity or grant" \
                  /tmp/depotflow-policy-roster-rejection.log || {
                    echo "::error::Migration rejected for unexpected reason"
                    tail -n 15 /tmp/depotflow-policy-roster-rejection.log
                    exit 1
                  }
                # A rejected migration must be atomic, including the earlier
                # function and policy rewrites within the same transaction.
                psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "drop policy depotflow_ci_unknown_policy on public.product_cost_history;"
                echo "PASS: unknown $mode RLS policy blocked safely"
              done

              # A policy's existence means nothing when the table's RLS is
              # disabled. This previously passed the identity/count checks.
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c 'alter table public.product_cost_history disable row level security;'
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                   -f "$f" >/tmp/depotflow-rls-off.log 2>&1; then
                echo "::error::Disabled RLS incorrectly accepted"
                exit 1
              fi
              grep -Fq "row level security disabled" /tmp/depotflow-rls-off.log || {
                tail -n 16 /tmp/depotflow-rls-off.log
                exit 1
              }
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c 'alter table public.product_cost_history enable row level security;'
              echo "PASS: disabled RLS on protected table blocked"

              # Exactly 26 owner policies means SALE TENDER LEGS does not
              # exist yet. It must NOT accept an arbitrary missing policy.
              psql -h /tmp -p 55439 -d postgres -X -At \
                -c "select format('create policy owner_read on public.product_cost_history for select to authenticated using (%s);',pg_get_expr(polqual,polrelid)) from pg_policy where polrelid='public.product_cost_history'::regclass and polname='owner_read';" \
                > /tmp/depotflow-restore-cost-policy.sql
              test -s /tmp/depotflow-restore-cost-policy.sql
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c 'drop policy owner_read on public.product_cost_history;'
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                   -f "$f" >/tmp/depotflow-missing-policy.log 2>&1; then
                echo "::error::Arbitrary missing owner policy incorrectly accepted"
                exit 1
              fi
              grep -Fq "Expected exact" /tmp/depotflow-missing-policy.log || {
                tail -n 16 /tmp/depotflow-missing-policy.log
                exit 1
              }
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -f /tmp/depotflow-restore-cost-policy.sql
              echo "PASS: arbitrary 26-policy subset rejected"

              for mode in select all; do
                psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "create policy depotflow_ci_unexpected_owner_read on private.shop_owner for $mode to authenticated using (true);"
                if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                     -f "$f" >/tmp/depotflow-private-policy.log 2>&1; then
                  echo "::error::Extra private.shop_owner $mode policy accepted"
                  exit 1
                fi
                grep -Fq "Unexpected private shop owner read policy" \
                  /tmp/depotflow-private-policy.log || {
                    tail -n 16 /tmp/depotflow-private-policy.log
                    exit 1
                  }
                psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c 'drop policy depotflow_ci_unexpected_owner_read on private.shop_owner;'
                echo "PASS: rogue private.shop_owner $mode policy blocked"
              done
            fi
            if [[ "$f" == *20261018124000_finalize_legacy_creation_api_cutover.sql ]]; then
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -f supabase/tests/legacy_creation_pre_cutover_compat.sql
              # Unapproved cutover must fail transactionally, preserving
              # all legacy creation rights for the still-running old app.
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                   -f "$f" >/tmp/depotflow-cutover-guard.log 2>&1; then
                echo "::error::Legacy creation grants revoked before approval"
                exit 1
              fi
              grep -Fq "CUTOVER ATTEMPT NOT CONFIRMED" \
                /tmp/depotflow-cutover-guard.log
              # Even a same-transaction confirmation must not skip durable
              # operator signoff while it remains OFF.
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "BEGIN; SET LOCAL depotflow.legacy_creation_cutover_attempt='confirmed';" \
                  -f "$f" >/tmp/depotflow-cutover-no-signoff.log 2>&1; then
                echo "::error::Cutover accepted without operator signoff"
                exit 1
              fi
              grep -Fq "LEGACY CREATION CUTOVER NOT AUTHORIZED" \
                /tmp/depotflow-cutover-no-signoff.log
              old_grants="$(psql -h /tmp -p 55439 -d postgres -X -At -v ON_ERROR_STOP=1 \
                -c "select has_column_privilege('authenticated','public.customers','id','INSERT') and has_column_privilege('authenticated','public.products','id','INSERT') and has_function_privilege('authenticated','public.create_crate_type(uuid,text,text,numeric,text)','EXECUTE');")"
              if [[ "$old_grants" != "t" ]]; then
                echo "::error::Unapproved cutover changed old-client grants"
                exit 1
              fi
              # Approved scenario is simulated in free DISPOSABLE CI only.
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "update private.legacy_creation_cutover_gate set authorized=true,authorized_at=now() where singleton;"
              # Approval withdrawal must serialize with the finalizer.
              # A different connection updates/LOCKS the approval row first,
              # and commits after the cutover begins. The migration must see
              # the withdrawn consent, fail closed and preserve old grants.
              (psql -h /tmp -p 55439 -d postgres -X -At -v ON_ERROR_STOP=1 \
                -c 'BEGIN;' \
                -c "update private.legacy_creation_cutover_gate set authorized=false,authorized_at=null where singleton;" \
                -c "select 'WITHDRAWAL_ROW_LOCKED';" \
                -c "select pg_sleep(1.5);" -c 'COMMIT;' \
                > /tmp/depotflow-withdrawal-lock.log 2>&1) &
              withdrawal_pid=$!
              for i in {1..90}; do
                if grep -Fq "WITHDRAWAL_ROW_LOCKED" /tmp/depotflow-withdrawal-lock.log 2>/dev/null; then
                  break
                fi
                sleep 0.05
              done
              if ! grep -Fq "WITHDRAWAL_ROW_LOCKED" /tmp/depotflow-withdrawal-lock.log 2>/dev/null; then
                echo "::error::Could not establish adversarial approval withdrawal lock"
                kill "$withdrawal_pid" || true
                wait "$withdrawal_pid" || true
                exit 1
              fi
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "BEGIN; SET LOCAL depotflow.legacy_creation_cutover_attempt='confirmed';" \
                  -f "$f" >/tmp/depotflow-withdrawn-cutover.log 2>&1; then
                echo "::error::Cutover raced an already-running approval withdrawal"
                exit 1
              fi
              wait "$withdrawal_pid"
              grep -Fq "LEGACY CREATION CUTOVER NOT AUTHORIZED" \
                /tmp/depotflow-withdrawn-cutover.log
              old_grants="$(psql -h /tmp -p 55439 -d postgres -X -At -v ON_ERROR_STOP=1 \
                -c "select has_column_privilege('authenticated','public.customers','id','INSERT') and has_column_privilege('authenticated','public.products','id','INSERT') and has_function_privilege('authenticated','public.create_crate_type(uuid,text,text,numeric,text)','EXECUTE');")"
              test "$old_grants" = "t"
              echo "PASS: prior withdrawal blocked cutover; legacy rights preserved"
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "update private.legacy_creation_cutover_gate set authorized=true,authorized_at=now() where singleton;"
              # Adversarial AFTER-PREFLIGHT failure: refuse the final
              # authorization-consumption UPDATE after SQL has already issued
              # creation-grant REVOKEs. PostgreSQL must roll back everything.
              # The intentionally injected trigger exists only in this
              # disposable runner and is dropped before real acceptance.
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "create function private.ci_abort_cutover_on_consume() returns trigger language plpgsql as \$\$ begin raise exception 'Injected cutover consumption failure'; end; \$\$;"
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "create trigger ci_abort_cutover_consumption before update on private.legacy_creation_cutover_gate for each row execute function private.ci_abort_cutover_on_consume();"
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -c "BEGIN; SET LOCAL depotflow.legacy_creation_cutover_attempt='confirmed';" \
                  -f "$f" >/tmp/depotflow-cutover-failed-after-preflight.log 2>&1; then
                echo "::error::Injected late cutover failure was incorrectly committed"
                exit 1
              fi
              grep -Fq "Injected cutover consumption failure" \
                /tmp/depotflow-cutover-failed-after-preflight.log
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "drop trigger ci_abort_cutover_consumption on private.legacy_creation_cutover_gate; drop function private.ci_abort_cutover_on_consume();"
              old_grants="$(psql -h /tmp -p 55439 -d postgres -X -At -v ON_ERROR_STOP=1 \
                -c "select has_column_privilege('authenticated','public.customers','id','INSERT') and has_column_privilege('authenticated','public.products','id','INSERT') and has_function_privilege('authenticated','public.create_crate_type(uuid,text,text,numeric,text)','EXECUTE');")"
              if [[ "$old_grants" != "t" ]]; then
                echo "::error::Late cutover failure left permissions revoked"
                exit 1
              fi
              echo "PASS: failed authorized cutover rolled back ALL revoked grants"
              # A previous failed attempt leaves durable authorization=true.
              # A later unattended retry STILL must be refused without fresh
              # same-transaction approval.
              if psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                  -f "$f" >/tmp/depotflow-cutover-stale-approval.log 2>&1; then
                echo "::error::Stale approval enabled unattended cutover"
                exit 1
              fi
              grep -Fq "CUTOVER ATTEMPT NOT CONFIRMED" \
                /tmp/depotflow-cutover-stale-approval.log
              old_grants="$(psql -h /tmp -p 55439 -d postgres -X -At -v ON_ERROR_STOP=1 \
                -c "select has_column_privilege('authenticated','public.customers','id','INSERT') and has_column_privilege('authenticated','public.products','id','INSERT') and has_function_privilege('authenticated','public.create_crate_type(uuid,text,text,numeric,text)','EXECUTE');")"
              test "$old_grants" = "t"
              # SET LOCAL and migration run share exactly one connection and
              # one transaction. On an error, the connection ends and the
              # temporary approval is rolled back, never reusable.
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
                -c "BEGIN; SET LOCAL depotflow.legacy_creation_cutover_attempt='confirmed';" \
                -f "$f"
            else
              psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f "$f"
            fi
          done

      - name: Run SQL test suite (each file is self-contained and rolls back)
        run: |
          set -euo pipefail
          # Assert production privilege first: neither original nor new depot
          # browser may directly INSERT a customer, with or without a PK.
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          do $guard$
          begin
           if has_any_column_privilege('authenticated','public.customers','INSERT')
           then raise exception 'Unaudited customer-ID insert grant remains';end if;
          end;
          $guard$;
          SQL
          # Historical isolated SQL fixtures intentionally submit fixed IDs
          # to exercise old trigger/RLS/reporting behavior. Restore ONLY
          # the legacy columns in disposable SQL tests, never business_id,
          # then REVOKE before running new real-concurrency scripts. The dedicated Data API
          # test revokes it within its own transaction to verify live policy.
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
            -c 'grant insert (id,name,phone,business_name,address) on public.customers to authenticated;'
          # Historical fixtures predate generated-ID RPCs and insert rows by
          # fixed IDs to test financial and stock behavior. Their deprecated
          # creation privileges exist ONLY in this disposable PG cluster;
          # production revokes them in the final migration. The dedicated
          # legacy_assortment_identity_boundary.sql test revokes again inside
          # its rollback-only transaction to prove real client access is blocked.
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          grant insert (
            id,name,size,image_url,bottles_per_crate,full_crate_price,
            half_crate_price,quarter_crate_price,bottle_price,bottles_returnable,
            empty_family,crate_type,bottle_type,crate_type_id,catalogue_product_id,
            is_active,created_at
          ) on public.products to authenticated;
          grant execute on function public.create_crate_type(uuid,text,text,numeric,text) to authenticated;
          grant execute on function private.create_crate_type(uuid,text,text,numeric,text) to authenticated;
          SQL
          for f in supabase/tests/*.sql; do
            case "$f" in
              */customer_archiving.sql|*/customer_payments.sql|*/empties_rules.sql|*/sale_partial_pricing.sql|*/record_sale_v2_empties.sql|*/legacy_creation_pre_cutover_compat.sql|*/tenant_product_write_policy_scope.sql) continue ;;
            esac
            echo "Running $f"
            psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 \
            -c 'revoke insert (id,name,phone,business_name,address) on public.customers from authenticated;'
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          revoke insert (
            id,name,size,image_url,bottles_per_crate,full_crate_price,
            half_crate_price,quarter_crate_price,bottle_price,bottles_returnable,
            empty_family,crate_type,bottle_type,crate_type_id,catalogue_product_id,
            is_active,created_at
          ) on public.products from authenticated;
          revoke execute on function public.create_crate_type(uuid,text,text,numeric,text) from authenticated;
          revoke execute on function private.create_crate_type(uuid,text,text,numeric,text) from authenticated;
          SQL
          # This policy test asserts the production privilege boundary, so run
          # it only after the historical fixtures' temporary product INSERT
          # grant has been revoked.
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/tenant_product_write_policy_scope.sql
          psql -h /tmp -p 55439 -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          do $post_sql_fixture$
          begin
           if has_any_column_privilege('authenticated','public.customers','INSERT')
           then raise exception 'Customer chosen-PK privilege leaked out of SQL fixture';end if;
           if has_any_column_privilege('authenticated','public.products','INSERT')
             or has_function_privilege('authenticated','public.create_crate_type(uuid,text,text,numeric,text)','EXECUTE')
             or has_function_privilege('authenticated','private.create_crate_type(uuid,text,text,numeric,text)','EXECUTE')
           then raise exception 'Legacy assortment caller-selected ID grant leaked out of fixture';end if;
          end;
          $post_sql_fixture$;
          SQL

      - name: Run real-concurrency checks
        run: |
          set -euo pipefail
          for f in supabase/tests/concurrency/*.py; do
            case "$f" in
              */customer_archiving.py|*/customer_payments.py) continue ;;
            esac
            echo "Running $f"
            python3 "$f"
          done

      - name: Verify catalogue import against existing products
        run: |
          set -euo pipefail
          createdb -h /tmp -p 55439 depotflow_catalogue_import
          db=depotflow_catalogue_import
          psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for f in supabase/migrations/*.sql; do
            if [[ "$f" == *20261030100000_revoke_client_maintenance_privileges.sql ]]; then
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/tenant_client_maintenance_acl_before.sql
            fi
            if [[ "$f" == *business_product_cost_catalogue.sql ]]; then
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/product_catalogue_before.sql
            fi
            if [[ "$f" == *20261018124000_finalize_legacy_creation_api_cutover.sql ]]; then
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 \
                -c "update private.legacy_creation_cutover_gate set authorized=true,authorized_at=now() where singleton;"
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 \
                -c "BEGIN; SET LOCAL depotflow.legacy_creation_cutover_attempt='confirmed';" -f "$f"
            else
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f "$f"
            fi
            if [[ "$f" == *business_product_cost_catalogue.sql ]]; then
              psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/product_catalogue_after.sql
            fi
          done
          psql -h /tmp -p 55439 -d "$db" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/selling_prices_after.sql
