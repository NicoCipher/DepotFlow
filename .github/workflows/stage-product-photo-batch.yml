name: Stage real drink photos for visual review
on:
  push:
    branches: [assets/verified-master-photo-batch-20261014]
    paths:
      - docs/next-shop-photo-candidates-20261014.json
      - scripts/stage-product-photo-batch.py
      - .github/workflows/stage-product-photo-batch.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Download and prepare authentic real packshot candidates
        run: python scripts/stage-product-photo-batch.py
      - name: Commit for manual packaging review, not for production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/photo-review-20261014/
          git diff --cached --quiet && exit 0
          git commit -m "assets(photos): stage exact product candidates for manual review"
          git push origin HEAD:assets/verified-master-photo-batch-20261014
