name: Prepare 33 Export 60cl photo (one time)
on:
  push:
    branches: [assets/real-33-export-60cl-photo]
    paths:
      - .github/workflows/prepare-33-export-photo.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Verify and optimize 33 Export authentic packshot
        run: python .github/scripts/prepare_33_export_packshot.py
      - name: Commit processed image to asset branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/catalogue-photos/33-export-60cl.webp
          git commit -m "assets: add real 33 Export 60cl bottle photograph"
          git push origin HEAD:assets/real-33-export-60cl-photo
